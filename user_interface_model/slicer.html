<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slicer</title>
<!-- The Slicer (Nov 24): a character picture sliced into parts that are each made alone.
     Left: the Slicer (source, locked settings, prompt, the parts in order, centre first, each with its coloured and
     grey reference). Right: the 3D environment, every part's model shown live. The halves swap.
     Served by scripts/pipeline/slicer_page.py; the plan is outputs/slicer/<name>/slicer.json. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<style>
  /* the site's colours (app.html): sand gold and black */
  :root { --sand:#D4A853; --ink:#14100A; --raised:#231c11; --deep:#1a140c; --line:#6f5a2f; --dim:#b39048;
          --ok:#27a567; --now:#f08c2e; --bad:#e2574c; --text:#efe4cc; --radius:12px; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--ink); color:var(--text); font:14px/1.45 Inter, system-ui, sans-serif; }
  header { height:52px; display:flex; align-items:center; gap:14px; padding:0 16px; border-bottom:1px solid var(--line); }
  header h1 { font:700 20px Cinzel, serif; color:var(--sand); margin:0; letter-spacing:.04em; }
  header .grow { flex:1; }
  select, button { font:inherit; color:var(--text); background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:5px 10px; }
  button { cursor:pointer; } button:hover { border-color:var(--sand); color:var(--sand); }
  main { display:flex; height:calc(100% - 52px); }
  main.swapped { flex-direction:row-reverse; }
  .half { flex:1 1 50%; min-width:0; position:relative; }
  #slicer { overflow-y:auto; padding:16px; border-right:1px solid var(--line); }
  main.swapped #slicer { border-right:0; border-left:1px solid var(--line); }
  #slicer { display:flex; flex-direction:column; padding:0; overflow:hidden; }
  #messages { flex:1; overflow-y:auto; padding:18px 16px 8px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:88%; padding:10px 13px; border-radius:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.slicer { align-self:flex-start; background:var(--raised); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .msg.you { align-self:flex-end; background:#3a2d14; border:1px solid var(--sand); border-bottom-right-radius:4px; }
  .msg .who { font:700 12px Cinzel, serif; color:var(--sand); letter-spacing:.05em; margin-bottom:3px; }
  .msg.you .who { text-align:right; }
  #slicer { position:relative; }
  .msg b { color:var(--sand); font-weight:600; }
  .msg.working { color:var(--dim); font-style:italic; }
  .msg.working::after { content:" ⏳"; font-style:normal; }
  .msg.working.done::after { content:""; }
  .pics { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .pics figure { margin:0; flex:1 1 160px; max-width:260px; }
  .pics img { width:100%; border-radius:8px; background:var(--deep); display:block; cursor:zoom-in; }
  .pics figcaption { font-size:11.5px; color:var(--dim); margin-top:2px; }
  .pics figcaption.tag { color:var(--sand); font-weight:600; cursor:pointer; }
  .pics figcaption.tag:hover { text-decoration:underline; }
  #composer.busy textarea { opacity:.55; }
  .prompt { margin-top:8px; }
  .prompt summary { cursor:pointer; color:var(--dim); font-size:12.5px; white-space:normal; }
  .prompt textarea { margin-top:6px; }
  .buttons { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .buttons button.main { background:var(--sand); color:var(--ink); border-color:var(--sand); font-weight:600; }
  .buttons button.main:hover { filter:brightness(1.1); color:var(--ink); }
  .buttons button:disabled { opacity:.45; cursor:default; }
  textarea { width:100%; min-height:74px; resize:vertical; font:13px/1.4 Inter, sans-serif; color:var(--text);
             background:var(--deep); border:1px solid var(--line); border-radius:8px; padding:8px; }
  textarea:focus { outline:none; border-color:var(--sand); }
  .saved { color:var(--ok); font-size:12px; opacity:0; transition:opacity .3s; } .saved.show { opacity:1; }
  #composer { display:flex; gap:8px; padding:10px 12px 12px; border-top:1px solid var(--line); background:var(--ink); }
  #composer textarea { min-height:44px; max-height:160px; flex:1; }
  #composer button { align-self:flex-end; height:44px; padding:0 16px; }
  #attach { align-self:flex-end; height:44px; width:44px; padding:0; display:flex; align-items:center; justify-content:center; }
  #attached { padding:0 12px; margin:0; }
  #attached:empty { display:none; }
  #attached figure { flex:0 0 76px; position:relative; padding-top:8px; }
  #attached img { height:76px; object-fit:cover; cursor:default; }
  #attached .x { position:absolute; right:-6px; top:0; width:22px; height:22px; padding:0; border-radius:50%; font-size:12px; line-height:1; }
  #slicer.drop::after { content:"Drop the pictures here"; position:absolute; inset:8px; border:2px dashed var(--sand);
    border-radius:var(--radius); background:#14100ad9; color:var(--sand); display:flex; align-items:center; justify-content:center; font:600 16px Inter; pointer-events:none; }
  .msg.you .pics { justify-content:flex-end; }
  .muted { color:var(--dim); font-size:12.5px; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:2px 9px; font-size:12px; }
  dialog { background:var(--raised); color:var(--text); border:1px solid var(--sand); border-radius:var(--radius); padding:18px; width:min(480px, calc(100vw - 32px)); }
  dialog::backdrop { background:#000a; }
  dialog h3 { font:700 18px Cinzel, serif; color:var(--sand); margin:0 0 12px; }
  dialog label { display:block; margin-bottom:12px; font-size:13px; color:var(--dim); }
  dialog input { display:block; width:100%; margin-top:4px; font:inherit; color:var(--text); background:var(--deep); border:1px solid var(--line); border-radius:8px; padding:7px; }
  #newerror { color:var(--bad); min-height:1em; }
  #zoom { position:fixed; inset:0; background:#000d; display:none; align-items:center; justify-content:center; z-index:9; cursor:zoom-out; }
  #zoom img { max-width:94vw; max-height:94vh; }
  #view canvas { display:block; }
  .overlay { position:absolute; left:12px; top:12px; display:flex; gap:8px; align-items:center; }
  .legend { position:absolute; left:12px; bottom:12px; right:12px; display:flex; flex-wrap:wrap; gap:6px; pointer-events:none; }
  .legend .chip { background:#14100acc; pointer-events:auto; cursor:pointer; }
  .legend .chip.off { opacity:.4; }
  .legend .layer { background:#14100add; border:1px solid var(--line); border-radius:10px; padding:4px 8px; pointer-events:auto;
                   display:flex; align-items:center; gap:6px; font-size:12px; }
  .legend .layer.off .lname { opacity:.45; text-decoration:line-through; }
  .legend .layer.sel { border-color:var(--sand); box-shadow:0 0 0 1px var(--sand); }
  .legend .layer .lname { cursor:pointer; }
  .legend .layer input[type=range] { width:70px; accent-color:var(--sand); }
  .legend .layer button { padding:1px 7px; font-size:11.5px; border-radius:6px; }
  #modes { position:absolute; right:12px; top:12px; display:none; gap:6px; }
  #modes.show { display:flex; }
  #modes button.on { border-color:var(--sand); color:var(--sand); }
  #delbox .row { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  #delbox select { flex:1; }
  .empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
           color:var(--dim); pointer-events:none; padding:24px; }
  .error { color:var(--bad); }
  @media (max-width:820px) { main, main.swapped { flex-direction:column; } .half { flex:1 1 50%; } #slicer { border:0; border-bottom:1px solid var(--line); } .msg { max-width:96%; } }
</style>
</head>
<body>
<header>
  <h1>Slicer</h1>
  <select id="project" aria-label="Project"></select>
  <button id="new" title="A new character from one or more pictures">+ New</button>
  <button id="del" title="Delete a project, a part's pictures and model, or a picture">Delete…</button>
  <span id="status" class="muted"></span>
  <span class="grow"></span>
  <button id="swap" title="Swap the two halves">⇄ Swap halves</button>
</header>
<main id="main">
  <section class="half" id="slicer" aria-label="The Slicer chat">
    <div id="messages" aria-live="polite"></div>
    <div id="attached" class="pics"></div>
    <form id="composer">
      <button type="button" id="attach" title="Add pictures (or drop or paste them into the chat)" aria-label="Add pictures"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg></button>
      <input type="file" id="files" accept=".png,.jpg,.jpeg,.webp" multiple hidden>
      <textarea id="input" placeholder="Write to the Slicer…  (Enter sends, Shift+Enter a new line)" aria-label="Message"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </section>
  <section class="half" id="view" aria-label="3D environment">
    <div class="overlay">
      <button id="layout" title="Side by side, or each where it belongs">Side by side</button>
      <button id="fit">Fit view</button>
    </div>
    <div class="empty" id="empty">No part is in 3D yet.<br>Each one appears here as soon as its model is made.</div>
    <div class="legend" id="legend"></div>
    <div id="modes" aria-label="Move tools"><button data-mode="translate" class="on" title="Move (W)">Move</button>
      <button data-mode="rotate" title="Turn (E)">Turn</button><button data-mode="scale" title="Scale (R)">Scale</button>
      <button id="reset" title="Back to the automatic place">Reset</button><button id="done" title="Stop moving">Done</button></div>
  </section>
</main>
<div id="zoom"><img alt=""></div>
<dialog id="delbox">
  <form method="dialog" id="delform">
    <h3>Delete</h3>
    <div class="muted" style="margin-bottom:10px">Nothing is wiped at once: it goes into a trash folder
      (outputs/slicer/.trash or the project's trash/) and can be brought back.</div>
    <div class="row"><select id="delwhat" aria-label="What to delete"></select></div>
    <div class="muted" id="delerror"></div>
    <div class="buttons"><button type="submit" class="main" id="delgo">Delete</button><button type="button" id="delcancel">Cancel</button></div>
  </form>
</dialog>
<dialog id="newbox">
  <form method="dialog" id="newform">
    <h3>A new character</h3>
    <label>Name <input id="newname" required pattern="[a-z0-9][a-z0-9_\-]{0,39}" placeholder="e.g. lou" autocomplete="off"></label>
    <label>Pictures (optional: you can also send them in the chat)
      <input id="newfiles" type="file" accept=".png,.jpg,.jpeg,.webp" multiple></label>
    <div id="newpreview" class="pics"></div>
    <div class="muted" id="newerror"></div>
    <div class="buttons"><button type="submit" class="main" id="newgo">Start</button><button type="button" id="newcancel">Cancel</button></div>
  </form>
</dialog>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { TransformControls } from "three/addons/controls/TransformControls.js";

const $ = s => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k.startsWith("on") ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  for (const k of kids) e.append(k); return e; };
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

// ---- the two halves swap (remembered on this computer)
const main = $("#main");
if (store.get("slicer.swapped") === "1") main.classList.add("swapped");
$("#swap").onclick = () => { main.classList.toggle("swapped"); store.set("slicer.swapped", main.classList.contains("swapped") ? "1" : "0"); resize(); };

// ---- the 3D environment
const view = $("#view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a140c);
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
camera.position.set(0, 1, 4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x2a2015, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(2, 4, 3); scene.add(sun);
const grid = new THREE.GridHelper(10, 40, 0x6f5a2f, 0x3a2f1c); scene.add(grid);
const parts = new THREE.Group(); scene.add(parts);
const loader = new GLTFLoader();
const loaded = {};  // part id -> {url, object, home: its own position, on}
let sideBySide = true;

function resize() { const r = view.getBoundingClientRect(); renderer.setSize(r.width, r.height); camera.aspect = r.width / Math.max(r.height, 1); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(view);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

function arrange() {  // side by side (each part on the floor, in order) or each where it was made
  let x = 0; const ids = Object.keys(loaded).sort();
  for (const id of ids) { const o = loaded[id].object; o.visible = loaded[id].on; o.position.copy(loaded[id].home); }
  for (const id of ids) { const o = loaded[id].object; o.scale.setScalar(1); o.quaternion.identity(); }
  if (sideBySide) {
    for (const id of ids) { const o = loaded[id].object; if (!o.visible) continue;
      const box = new THREE.Box3().setFromObject(o), size = box.getSize(new THREE.Vector3());
      o.position.x += x - box.min.x; o.position.y -= box.min.y; o.position.z -= (box.min.z + box.max.z) / 2; x += size.x + 0.15; }
    parts.position.x = -x / 2;
  } else {  // Assembled: every layer where its place.json says, on the A-pose model (all pictures share its frame)
    parts.position.x = 0;
    const ref = loaded["00_apose"] || loaded["01_base_body"];
    if (ref) {
      const bb = new THREE.Box3().setFromObject(ref.object);
      const H = bb.max.y - bb.min.y, C = bb.getCenter(new THREE.Vector3());
      for (const id of ids) { const p = loaded[id], o = p.object; if (p === ref || !p.place || p.place.whole) continue;
        const box = new THREE.Box3().setFromObject(o), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
        const k = p.place.h * H / Math.max(size.y, 1e-6); o.scale.setScalar(k);
        o.position.x += C.x + p.place.cx * H - c.x * k; o.position.y += C.y - p.place.cy * H - c.y * k; o.position.z += C.z - c.z * k;
        // depth: its front lined up with the A-pose's front at the same height (the box centre is pulled back by
        // capes and wings: demon's mannequin stood behind her, Nov 24)
        const nb = new THREE.Box3().setFromObject(o), y0 = nb.min.y + 0.4 * (nb.max.y - nb.min.y), y1 = nb.min.y + 0.6 * (nb.max.y - nb.min.y);
        const mine = frontDepth(o, y0, y1), theirs = frontDepth(ref.object, y0, y1);
        if (mine !== null && theirs !== null) o.position.z += theirs - mine; }
    }
  }
  if (!sideBySide) for (const id of ids) { const p = loaded[id]; if (!p.manual) continue;  // moved by hand: exactly there
    p.object.position.fromArray(p.manual.position); p.object.quaternion.fromArray(p.manual.quaternion); p.object.scale.fromArray(p.manual.scale); }
  $("#empty").style.display = ids.length ? "none" : "";
}
function frontDepth(object, lo, hi) {  // how far forward (+z: glTF faces +z) the surface reaches between heights lo and hi
  const zs = [], v = new THREE.Vector3();
  object.updateMatrixWorld(true);
  object.traverse(m => { if (!m.isMesh) return; const pos = m.geometry.attributes.position, step = Math.max(1, Math.floor(pos.count / 30000));
    for (let i = 0; i < pos.count; i += step) { v.fromBufferAttribute(pos, i).applyMatrix4(m.matrixWorld); if (v.y >= lo && v.y <= hi) zs.push(v.z); } });
  if (!zs.length) return null;
  zs.sort((a, b) => a - b); return zs[Math.floor(zs.length * 0.9)];
}
function fit() {
  const box = new THREE.Box3().setFromObject(parts); if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() / 2;
  const d = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.9;
  controls.target.copy(c); camera.position.set(c.x, c.y + r * 0.25, c.z + d); camera.near = d / 100; camera.far = d * 10; camera.updateProjectionMatrix();
}
$("#fit").onclick = fit;
$("#layout").onclick = () => { sideBySide = !sideBySide; $("#layout").textContent = sideBySide ? "Side by side" : "Assembled"; arrange(); fit(); };

function show3d(part) {  // a part's model: loaded once per new file (its address has the file's time)
  const url = part.files.model, have = loaded[part.id];
  if (!url) { if (have) { parts.remove(have.object); delete loaded[part.id]; arrange(); } return; }
  if (have && have.url === url) { if (JSON.stringify(have.place) !== JSON.stringify(part.place)) { have.place = part.place; arrange(); } return; }
  loader.load(url, g => {
    if (have) parts.remove(have.object);
    loaded[part.id] = { url, object: g.scene, home: g.scene.position.clone(), on: have ? have.on : true, name: part.name,
                        place: part.place, manual: part.manual || null, opacity: have ? have.opacity : 1 };
    if (have && have.opacity < 1) opacity(loaded[part.id], have.opacity);
    parts.add(g.scene); arrange(); legend(); if (!have) fit();
  }, undefined, e => console.warn("could not load", url, e));
}
function opacity(p, v) {  // see-through: 1 = solid
  p.opacity = v;
  p.object.traverse(m => { if (!m.isMesh) return; for (const mat of [].concat(m.material)) {
    mat.transparent = v < 1; mat.opacity = v; mat.depthWrite = v >= 1; mat.needsUpdate = true; } });
}
function legend() {
  const el = $("#legend"); el.replaceChildren();
  for (const id of Object.keys(loaded).sort()) { const p = loaded[id];
    const slider = h("input", { type: "range", min: "0.1", max: "1", step: "0.05", title: "See-through", "aria-label": "See-through " + p.name });
    slider.value = p.opacity ?? 1; slider.oninput = () => opacity(p, +slider.value);
    el.append(h("span", { class: "layer" + (p.on ? "" : " off") + (selected === id ? " sel" : "") },
      h("span", { class: "lname", title: "Show or hide", onclick: () => { p.on = !p.on; arrange(); legend(); } }, `${id.slice(0, 2)} ${p.name}`),
      slider,
      h("button", { type: "button", title: "Move, turn or scale it by hand", onclick: () => select(id) }, "Move"))); }
}
// ---- moving a layer by hand (saved as its manual.json; Reset goes back to the automatic place)
const gizmo = new TransformControls(camera, renderer.domElement);
scene.add(gizmo.getHelper ? gizmo.getHelper() : gizmo);
gizmo.addEventListener("dragging-changed", e => { controls.enabled = !e.value; if (!e.value) saveHand(); });
let selected = null;
function select(id) {
  selected = id && loaded[id] ? id : null;
  if (selected) { if (sideBySide) { sideBySide = false; $("#layout").textContent = "Assembled"; arrange(); }
                  gizmo.attach(loaded[selected].object); } else gizmo.detach();
  $("#modes").classList.toggle("show", !!selected); legend();
}
for (const b of document.querySelectorAll("#modes [data-mode]")) b.onclick = () => {
  gizmo.setMode(b.dataset.mode); for (const o of document.querySelectorAll("#modes [data-mode]")) o.classList.toggle("on", o === b); };
addEventListener("keydown", e => { if (!selected || e.target.closest?.("textarea,input")) return;
  const k = { w: "translate", e: "rotate", r: "scale" }[e.key.toLowerCase()]; if (k) document.querySelector(`#modes [data-mode=${k}]`).click();
  if (e.key === "Escape") select(null); });
$("#done").onclick = () => select(null);
$("#reset").onclick = async () => { if (!selected) return; const p = loaded[selected]; p.manual = null;
  try { await api("api/place", { project: current, id: selected, manual: null }); } catch (e) { alert(e.message); }
  arrange(); gizmo.attach(p.object); };
async function saveHand() {
  if (!selected) return; const o = loaded[selected].object;
  const manual = { position: o.position.toArray(), quaternion: o.quaternion.toArray(), scale: o.scale.toArray() };
  loaded[selected].manual = manual;
  try { await api("api/place", { project: current, id: selected, manual }); } catch (e) { alert(e.message); }
}
function syncChecks() {}

// ---- the Slicer half: a chat, one step at a time
let current = null, seen = -1, lastKey = "";
const LABEL = { make_pictures: "Make it", remake_pictures: "Make it again", make_3d: "Good, make it 3D", skip: "Skip this part", replan: "Plan the parts again", restart: "Start again from step 1" };
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await r.json(); if (!r.ok) throw new Error(data.error || r.statusText); return data;
}
function rich(text) {  // **bold** and line breaks, nothing else
  const out = h("div"); text.split(/(\*\*[^*]+\*\*)/).forEach(t => out.append(t.startsWith("**") && t.endsWith("**") ? h("b", {}, t.slice(2, -2)) : t));
  return out;
}
function pic(url, caption) {
  const img = h("img", { src: url, alt: caption, loading: "lazy" });
  img.onclick = () => { $("#zoom img").src = url; $("#zoom").style.display = "flex"; };
  const cap = h("figcaption", {}, caption);
  if (/^#\d+$/.test(caption)) {  // #N: click to name this picture in your message
    cap.classList.add("tag"); cap.title = "Click to name this picture in your message";
    cap.onclick = () => { const box = $("#input"); box.value = (box.value ? box.value.replace(/\s*$/, " ") : "") + caption + " "; box.focus(); };
  }
  return h("figure", {}, img, cap);
}
$("#zoom").onclick = () => $("#zoom").style.display = "none";
function promptEditor(part) {
  const saved = h("span", { class: "saved" }, "saved");
  const box = h("textarea", { "aria-label": "Prompt", "data-id": part.id }); box.value = part.prompt || "";
  box.addEventListener("change", async () => {
    try { await api("api/part", { project: current, id: part.id, field: "prompt", value: box.value });
          saved.className = "saved show"; setTimeout(() => saved.className = "saved", 1500); }
    catch (e) { saved.textContent = e.message; saved.className = "saved show error"; }
  });
  return h("details", { class: "prompt", open: "" }, h("summary", {}, "The prompt ", saved), box);
}
function message(m, st, last) {
  const el = h("div", { class: "msg " + m.who + (m.kind === "working" ? " working" : "") });
  el.append(h("div", { class: "who" }, m.who === "you" ? "You" + (m.time ? " · " + m.time : "") : "Slicer"), rich(m.text));
  if (m.kind === "working" && !(st.waiting || []).some(r => r.part === m.part)) el.classList.add("done");
  if (!st.parts[m.part] && m.part !== "_plan" && m.kind === "step") return el;
  if ((m.image === "source" || m.image === "sources") && (st.source_urls || []).length)
    el.append(h("div", { class: "pics" }, ...st.source_urls.map((u, i) => u ? pic(u, `#${i + 1}`) : null).filter(Boolean)));
  if (m.sources && (st.source_urls || []).length)
    el.append(h("div", { class: "pics" }, ...m.sources.filter(i => st.source_urls[i]).map(i => pic(st.source_urls[i], `#${i + 1}`))));
  if (m.images) el.append(h("div", { class: "pics" }, ...m.images.map((u, i) => pic(u, (m.sources ? ["grey"] : ["coloured", "grey"])[i] || ""))));
  const part = m.part && st.parts[m.part];
  if (m.kind === "step" && part && last) el.append(promptEditor(part));
  if (m.buttons && (part || m.part === "_plan")) {
    const live = last && !(st.waiting || []).some(r => r.part === m.part);
    el.append(h("div", { class: "buttons" }, ...m.buttons.map((b, i) => {
      const btn = h("button", { class: i === 0 ? "main" : "", type: "button" }, LABEL[b] || b);
      btn.disabled = !live;
      btn.onclick = async () => { btn.disabled = true; try { await api("api/say", { project: current, action: b, part: m.part }); refresh(); } catch (e) { alert(e.message); } };
      return btn; })));
  }
  return el;
}
function drawChat(st) {
  const box = $("#messages"), atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const lastWithButtons = [...st.messages].reverse().find(m => m.buttons);
  box.replaceChildren(...st.messages.map(m => message(m, st, m === lastWithButtons)));
  if (st.thinking) box.append(h("div", { class: "msg slicer working" }, h("div", { class: "who" }, "Slicer"), "typing…"));
  // while a picture or a model is made the chat waits: the chat model and the picture model never share the GPU
  const busy = (st.waiting || []).some(w => ["edit", "make_pictures", "remake_pictures", "make_3d", "plan"].includes(w.do));
  for (const el of [$("#input"), $("#send"), $("#attach")]) el.disabled = busy;
  $("#composer").classList.toggle("busy", busy);
  $("#input").placeholder = busy ? "Making a picture… the chat waits until it is done."
                                 : "Write to the Slicer…  (Enter sends, Shift+Enter a new line; click a #number to name a picture)";
  if (atEnd || st.messages.length > seen) box.scrollTop = box.scrollHeight;
  seen = st.messages.length;
}
let attached = [];  // pictures waiting to be sent with the next message
const PICTURE = /\.(png|jpe?g|webp)$/i;
function attach(files) {
  const ok = [...files].filter(f => PICTURE.test(f.name) || /^image\/(png|jpeg|webp)$/.test(f.type));
  for (const f of ok) attached.push(f.name && PICTURE.test(f.name) ? f : new File([f], `pasted_${Date.now()}.${f.type.split("/")[1].replace("jpeg", "jpg")}`, { type: f.type }));
  if (ok.length < files.length) alert("Only pictures: png, jpg or webp.");
  drawAttached(); $("#input").focus();
}
function drawAttached() {
  $("#attached").replaceChildren(...attached.map((f, i) => {
    const fig = h("figure", {}, h("img", { src: URL.createObjectURL(f), alt: f.name }));
    fig.append(h("button", { class: "x", type: "button", title: "Remove", onclick: () => { attached.splice(i, 1); drawAttached(); } }, "✕"));
    return fig; }));
}
$("#attach").onclick = () => $("#files").click();
$("#files").onchange = () => { attach($("#files").files); $("#files").value = ""; };
const panel = $("#slicer"); let depth = 0;
panel.addEventListener("dragenter", e => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); depth++; panel.classList.add("drop"); } });
panel.addEventListener("dragover", e => { if ([...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
panel.addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; panel.classList.remove("drop"); } });
panel.addEventListener("drop", e => { e.preventDefault(); depth = 0; panel.classList.remove("drop"); attach(e.dataTransfer.files); });
document.addEventListener("paste", e => {  // anywhere on the page, not only in the text box
  if ($("#newbox").open) return;
  const f = [...(e.clipboardData?.files || [])]; if (f.length) { e.preventDefault(); attach(f); } });
$("#composer").addEventListener("submit", async e => {
  e.preventDefault(); const t = $("#input").value.trim(); if ((!t && !attached.length) || !current) return;
  $("#send").disabled = true;
  try {
    const files = await Promise.all(attached.map(async f => ({ name: f.name, data: await readAs(f) })));
    await api("api/say", { project: current, text: t, files });
    $("#input").value = ""; attached = []; drawAttached(); refresh();
  } catch (err) { alert(err.message); }
  $("#send").disabled = false;
});
$("#input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#composer").requestSubmit(); } });
async function refresh() {
  if (!current) return;
  try {
    const st = await api("api/chat?name=" + encodeURIComponent(current));
    const key = JSON.stringify([st.messages.length, st.waiting, st.thinking, Object.values(st.parts).map(p => p.files)]);
    const typing = document.activeElement?.closest?.(".prompt");
    if (key !== lastKey && !typing) { drawChat(st); lastKey = key; }
    for (const part of Object.values(st.parts)) show3d(part);
    const made = Object.values(st.parts).filter(p => p.status === "made").length;
    $("#status").textContent = `${made} of ${Object.keys(st.parts).length} parts in 3D`; $("#status").className = "muted";
  } catch (e) { $("#status").textContent = e.message; $("#status").className = "error"; }
}
// ---- delete (into the trash)
$("#del").onclick = async () => {
  if (!current) return;
  const st = await api("api/chat?name=" + encodeURIComponent(current));
  const opts = [h("option", { value: "project|" }, `The whole project "${current}"`)];
  for (const p of Object.values(st.parts)) if (p.status !== "planned") opts.push(h("option", { value: "part|" + p.id }, `Part ${p.id.slice(0, 2)} ${p.name}: its pictures and model`));
  (st.source_urls || []).forEach((u, i) => { if (u) opts.push(h("option", { value: "picture|" + i }, `Picture #${i + 1}`)); });
  $("#delwhat").replaceChildren(...opts); $("#delerror").textContent = ""; $("#delbox").showModal();
};
$("#delcancel").onclick = () => $("#delbox").close();
$("#delform").addEventListener("submit", async e => {
  e.preventDefault(); const [what, target] = $("#delwhat").value.split("|");
  if (what === "project" && prompt(`Type the project's name to delete it: ${current}`) !== current) return;
  try { await api("api/delete", { project: current, what, target });
        $("#delbox").close();
        if (what === "project") { store.set("slicer.project", ""); await start(true); }
        else { if (what === "part" && loaded[target]) { parts.remove(loaded[target].object); delete loaded[target]; legend(); arrange(); } lastKey = ""; refresh(); } }
  catch (err) { $("#delerror").textContent = err.message; }
});
// ---- a new character
const readAs = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
$("#new").onclick = () => { $("#newform").reset(); $("#newpreview").replaceChildren(); $("#newerror").textContent = ""; $("#newbox").showModal(); };
$("#newcancel").onclick = () => $("#newbox").close();
$("#newfiles").onchange = () => $("#newpreview").replaceChildren(...[...$("#newfiles").files].map(f => pic(URL.createObjectURL(f), f.name)));
$("#newname").oninput = () => { $("#newname").value = $("#newname").value.toLowerCase().replace(/ /g, "_"); };
$("#newform").addEventListener("submit", async e => {
  e.preventDefault(); $("#newgo").disabled = true; $("#newerror").textContent = "Uploading…";
  try {
    const files = await Promise.all([...$("#newfiles").files].map(async f => ({ name: f.name, data: await readAs(f) })));
    const r = await api("api/new", { name: $("#newname").value, files });
    store.set("slicer.project", r.name); $("#newbox").close(); await start(true);
  } catch (err) { $("#newerror").textContent = err.message; }
  $("#newgo").disabled = false;
});
let ticking = false;
async function start(again) {
  try {
    const names = await api("api/projects");
    const sel = $("#project"); sel.replaceChildren(...names.map(n => h("option", { value: n }, n)));
    current = names.includes(store.get("slicer.project")) ? store.get("slicer.project") : names[0] || null;
    if (current) sel.value = current;
    sel.onchange = () => { current = sel.value; store.set("slicer.project", current); for (const id in loaded) parts.remove(loaded[id].object);
                           for (const id in loaded) delete loaded[id]; legend(); arrange(); seen = -1; lastKey = ""; refresh(); };
    if (!current) $("#messages").append(h("div", { class: "msg slicer" }, "No project yet: outputs/slicer/<name>/slicer.json"));
  } catch (e) { $("#messages").append(h("div", { class: "msg slicer error" }, "The Slicer's server is not reachable: python scripts/pipeline/slicer_page.py")); }
  if (again) { for (const id in loaded) { parts.remove(loaded[id].object); delete loaded[id]; } legend(); arrange(); seen = -1; lastKey = ""; }
  refresh(); if (!ticking) { ticking = true; setInterval(refresh, 2000); }
}
resize(); start();
</script>
</body>
</html>
