<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slicer</title>
<!-- The Slicer (Nov 24): a character picture sliced into parts that are each made alone.
     Left: the Slicer (source, locked settings, prompt, the parts in order, centre first, each with its coloured and
     grey reference). Right: the 3D environment, every part's model shown live. The halves swap.
     Served by scripts/pipeline/slicer_page.py; the plan is outputs/slicer/<name>/slicer.json. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<style>
  /* the site's colours (app.html): sand gold and black */
  :root { --sand:#D4A853; --ink:#14100A; --raised:#231c11; --deep:#1a140c; --line:#6f5a2f; --dim:#b39048;
          --ok:#27a567; --now:#f08c2e; --bad:#e2574c; --text:#efe4cc; --radius:12px; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--ink); color:var(--text); font:14px/1.45 Inter, system-ui, sans-serif; }
  header { height:52px; display:flex; align-items:center; gap:14px; padding:0 16px; border-bottom:1px solid var(--line); }
  header h1 { font:700 20px Cinzel, serif; color:var(--sand); margin:0; letter-spacing:.04em; }
  header .grow { flex:1; }
  select, button { font:inherit; color:var(--text); background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:5px 10px; }
  button { cursor:pointer; } button:hover { border-color:var(--sand); color:var(--sand); }
  main { display:flex; height:calc(100% - 52px); }
  main.swapped { flex-direction:row-reverse; }
  .half { flex:1 1 50%; min-width:0; position:relative; }
  #slicer { overflow-y:auto; padding:16px; border-right:1px solid var(--line); }
  main.swapped #slicer { border-right:0; border-left:1px solid var(--line); }
  h2 { font:600 13px Inter; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:18px 0 8px; }
  .card { background:var(--raised); border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:12px; }
  .source { display:grid; grid-template-columns:minmax(120px, 42%) 1fr; gap:12px; }
  .source img { width:100%; border-radius:8px; background:var(--deep); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 8px; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:2px 9px; font-size:12px; }
  .chip b { color:var(--sand); font-weight:600; }
  .chip.lock::before { content:"🔒 "; }
  .muted { color:var(--dim); font-size:12.5px; }
  .part { display:grid; grid-template-columns:1fr; gap:8px; }
  .part.focus { border-color:var(--sand); }
  .part .top { display:flex; align-items:center; gap:8px; }
  .part .num { font:700 15px Cinzel, serif; color:var(--sand); min-width:26px; }
  .part .name { font-weight:600; flex:1; }
  .badge { font-size:11.5px; border-radius:999px; padding:1px 8px; border:1px solid currentColor; }
  .badge.planned { color:var(--dim); } .badge.pictures { color:var(--now); } .badge.made { color:var(--ok); }
  .refs { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .ref { aspect-ratio:1; border:1px dashed var(--line); border-radius:8px; background:var(--deep); display:flex;
         align-items:center; justify-content:center; color:var(--dim); font-size:12px; overflow:hidden; position:relative; }
  .ref img { width:100%; height:100%; object-fit:contain; }
  .ref span.tag { position:absolute; left:6px; top:4px; font-size:11px; color:var(--sand); text-shadow:0 1px 2px #000; }
  textarea { width:100%; min-height:74px; resize:vertical; font:13px/1.4 Inter, sans-serif; color:var(--text);
             background:var(--deep); border:1px solid var(--line); border-radius:8px; padding:8px; }
  textarea:focus { outline:none; border-color:var(--sand); }
  details summary { cursor:pointer; color:var(--dim); font-size:12.5px; }
  .row { display:flex; align-items:center; gap:10px; font-size:12.5px; }
  .saved { color:var(--ok); font-size:12px; opacity:0; transition:opacity .3s; } .saved.show { opacity:1; }
  #view canvas { display:block; }
  .overlay { position:absolute; left:12px; top:12px; display:flex; gap:8px; align-items:center; }
  .legend { position:absolute; left:12px; bottom:12px; right:12px; display:flex; flex-wrap:wrap; gap:6px; pointer-events:none; }
  .legend .chip { background:#14100acc; pointer-events:auto; cursor:pointer; }
  .legend .chip.off { opacity:.4; }
  .empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
           color:var(--dim); pointer-events:none; padding:24px; }
  .error { color:var(--bad); }
  @media (max-width:820px) { main, main.swapped { flex-direction:column; } .half { flex:1 1 50%; } #slicer { border:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Slicer</h1>
  <select id="project" aria-label="Project"></select>
  <span id="status" class="muted"></span>
  <span class="grow"></span>
  <button id="swap" title="Swap the two halves">⇄ Swap halves</button>
</header>
<main id="main">
  <section class="half" id="slicer" aria-label="The Slicer"></section>
  <section class="half" id="view" aria-label="3D environment">
    <div class="overlay">
      <button id="layout" title="Side by side, or each where it belongs">Side by side</button>
      <button id="fit">Fit view</button>
    </div>
    <div class="empty" id="empty">No part is in 3D yet.<br>Each one appears here as soon as its model is made.</div>
    <div class="legend" id="legend"></div>
  </section>
</main>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const $ = s => document.querySelector(s);
const h = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k.startsWith("on") ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  for (const k of kids) e.append(k); return e; };
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

// ---- the two halves swap (remembered on this computer)
const main = $("#main");
if (store.get("slicer.swapped") === "1") main.classList.add("swapped");
$("#swap").onclick = () => { main.classList.toggle("swapped"); store.set("slicer.swapped", main.classList.contains("swapped") ? "1" : "0"); resize(); };

// ---- the 3D environment
const view = $("#view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a140c);
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
camera.position.set(0, 1, 4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x2a2015, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(2, 4, 3); scene.add(sun);
const grid = new THREE.GridHelper(10, 40, 0x6f5a2f, 0x3a2f1c); scene.add(grid);
const parts = new THREE.Group(); scene.add(parts);
const loader = new GLTFLoader();
const loaded = {};  // part id -> {url, object, home: its own position, on}
let sideBySide = true;

function resize() { const r = view.getBoundingClientRect(); renderer.setSize(r.width, r.height); camera.aspect = r.width / Math.max(r.height, 1); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(view);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

function arrange() {  // side by side (each part on the floor, in order) or each where it was made
  let x = 0; const ids = Object.keys(loaded).sort();
  for (const id of ids) { const o = loaded[id].object; o.visible = loaded[id].on; o.position.copy(loaded[id].home); }
  if (sideBySide) {
    for (const id of ids) { const o = loaded[id].object; if (!o.visible) continue;
      const box = new THREE.Box3().setFromObject(o), size = box.getSize(new THREE.Vector3());
      o.position.x += x - box.min.x; o.position.y -= box.min.y; o.position.z -= (box.min.z + box.max.z) / 2; x += size.x + 0.15; }
    parts.position.x = -x / 2;
  } else parts.position.x = 0;
  $("#empty").style.display = ids.length ? "none" : "";
}
function fit() {
  const box = new THREE.Box3().setFromObject(parts); if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() / 2;
  const d = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.9;
  controls.target.copy(c); camera.position.set(c.x, c.y + r * 0.25, c.z + d); camera.near = d / 100; camera.far = d * 10; camera.updateProjectionMatrix();
}
$("#fit").onclick = fit;
$("#layout").onclick = () => { sideBySide = !sideBySide; $("#layout").textContent = sideBySide ? "Side by side" : "Assembled"; arrange(); fit(); };

function show3d(part) {  // a part's model: loaded once per new file (its address has the file's time)
  const url = part.files.model, have = loaded[part.id];
  if (!url) { if (have) { parts.remove(have.object); delete loaded[part.id]; arrange(); } return; }
  if (have && have.url === url) return;
  loader.load(url, g => {
    if (have) parts.remove(have.object);
    loaded[part.id] = { url, object: g.scene, home: g.scene.position.clone(), on: have ? have.on : true, name: part.name };
    parts.add(g.scene); arrange(); legend(); if (!have) fit();
  }, undefined, e => console.warn("could not load", url, e));
}
function legend() {
  const el = $("#legend"); el.replaceChildren();
  for (const id of Object.keys(loaded).sort()) { const p = loaded[id];
    el.append(h("span", { class: "chip" + (p.on ? "" : " off"), title: "Show or hide", onclick: () => { p.on = !p.on; arrange(); legend(); syncChecks(); } }, `${id.slice(0, 2)} ${p.name}`)); }
}
function syncChecks() { for (const [id, p] of Object.entries(loaded)) { const c = document.getElementById("show-" + id); if (c) c.checked = p.on; } }

// ---- the Slicer half
let current = null, shown = {};
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await r.json(); if (!r.ok) throw new Error(data.error || r.statusText); return data;
}
function ref(label, url) {
  return h("div", { class: "ref" }, h("span", { class: "tag" }, label), url ? h("img", { src: url, alt: label, loading: "lazy" }) : "not made yet");
}
function editor(part, field, label) {
  const saved = h("span", { class: "saved" }, "saved");
  const box = h("textarea", { "aria-label": label, "data-field": field, "data-id": part.id });
  box.value = part[field] || "";
  box.addEventListener("change", async () => {
    try { await api("api/part", { project: current, id: part.id, field, value: box.value });
          saved.textContent = "saved"; saved.className = "saved show"; setTimeout(() => saved.className = "saved", 1500); }
    catch (e) { saved.textContent = e.message; saved.className = "saved show error"; }
  });
  return [box, saved];
}
function render(plan) {
  const root = $("#slicer"); root.replaceChildren();
  const L = plan.locked || {};
  root.append(h("h2", {}, "Source"), h("div", { class: "card source" },
    plan.source_url ? h("img", { src: plan.source_url, alt: "The source picture" }) : h("div", { class: "ref" }, "no picture"),
    h("div", {},
      h("div", { class: "chips" }, ...Object.entries(L).map(([k, v]) => h("span", { class: "chip lock", title: "Locked for every part" }, k + ": ", h("b", {}, v)))),
      h("div", { class: "muted" }, "Image model: ", h("b", {}, plan.editor || "not chosen yet")),
      h("h2", {}, "Slicer prompt"), h("div", {}, plan.instruction || ""))));
  root.append(h("h2", {}, `Parts, in the order they are made (${plan.parts.length})`));
  for (const part of plan.parts) {
    const [prompt, saved] = editor(part, "prompt", "Prompt, coloured");
    const [grey, saved2] = editor(part, "grey_prompt", "Prompt, grey");
    const check = h("input", { type: "checkbox", id: "show-" + part.id });
    check.checked = loaded[part.id] ? loaded[part.id].on : true; check.disabled = !part.files.model;
    check.addEventListener("change", () => { if (loaded[part.id]) { loaded[part.id].on = check.checked; arrange(); legend(); } });
    root.append(h("div", { class: "card part", id: "part-" + part.id },
      h("div", { class: "top" }, h("span", { class: "num" }, part.id.slice(0, 2)), h("span", { class: "name" }, part.name),
        h("span", { class: "badge " + part.status }, { planned: "planned", pictures: "pictures made", made: "in 3D" }[part.status])),
      h("div", { class: "muted" }, part.what || ""),
      h("div", { class: "refs" }, ref("coloured", part.files.colour), ref("grey", part.files.grey)),
      h("div", { class: "row" }, h("b", {}, "Prompt"), saved), prompt,
      h("details", {}, h("summary", {}, "Prompt for the grey version"), grey, saved2),
      h("label", { class: "row" }, check, part.files.model ? "show in 3D" : "no model yet")));
  }
}
function changed(plan) {  // what the page needs to redraw: files and statuses, not the prompts being typed
  return JSON.stringify(plan.parts.map(p => [p.id, p.name, p.what, p.status, p.files, document.activeElement?.dataset?.id === p.id ? "" : p.prompt + p.grey_prompt])) + plan.source_url + plan.instruction;
}
async function refresh() {
  if (!current) return;
  try {
    const plan = await api("api/project?name=" + encodeURIComponent(current));
    const key = changed(plan);
    if (key !== shown[current] && !(document.activeElement?.tagName === "TEXTAREA")) { render(plan); shown[current] = key; }
    for (const part of plan.parts) show3d(part);
    const made = plan.parts.filter(p => p.status === "made").length;
    $("#status").textContent = `${made} of ${plan.parts.length} parts in 3D`; $("#status").className = "muted";
  } catch (e) { $("#status").textContent = e.message; $("#status").className = "error"; }
}
async function start() {
  try {
    const names = await api("api/projects");
    const sel = $("#project"); sel.replaceChildren(...names.map(n => h("option", { value: n }, n)));
    current = names.includes(store.get("slicer.project")) ? store.get("slicer.project") : names[0] || null;
    if (current) sel.value = current;
    sel.onchange = () => { current = sel.value; store.set("slicer.project", current); for (const id in loaded) parts.remove(loaded[id].object);
                           for (const id in loaded) delete loaded[id]; legend(); arrange(); shown = {}; refresh(); };
    if (!current) $("#slicer").append(h("div", { class: "card" }, "No project yet: outputs/slicer/<name>/slicer.json"));
  } catch (e) { $("#slicer").append(h("div", { class: "card error" }, "The Slicer's server is not reachable: python scripts/pipeline/slicer_page.py")); }
  refresh(); setInterval(refresh, 2000);
}
resize(); start();
</script>
</body>
</html>
