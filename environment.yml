# Conda environment for TRELLIS.2 + 3D inpainting experiments.
# Don't create it directly with conda; run ./install.sh, which also builds TRELLIS.2's CUDA add-ons.
#
# Versions are the ones tested on Fedora 44 + RTX 3090 (October 2026).
# CUDA 12.4 and GCC 12 come from conda, so the system's own CUDA/compiler versions don't matter.
name: inpainting-3d-modelling
channels:
  - nvidia/label/cuda-12.4.1
  - conda-forge
dependencies:
  - python=3.10
  - cuda-toolkit=12.4.1
  - gcc=12.4
  - gxx=12.4
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - torchvision==0.21.0+cu124
      # Prebuilt wheel (building flash-attn from source takes hours)
      - https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.3/flash_attn-2.7.3+cu12torch2.6cxx11abiFALSE-cp310-cp310-linux_x86_64.whl
      # transformers 5 breaks DINOv3 in TRELLIS.2 ('DINOv3ViTModel' has no attribute 'layer')
      - transformers==4.57.6
      - huggingface_hub==0.36.2
      # OpenCV 5 wheels can't read the .exr environment maps
      - opencv-python-headless==4.14.0.94
      - numpy==2.2.6
      - scipy==1.15.3
      - pillow==12.3.0
      - imageio==2.38.0
      - imageio-ffmpeg==0.6.0
      - tqdm==4.70.1
      - easydict==1.13
      - ninja==1.13.2
      - trimesh==5.1.1
      - gradio==6.0.1
      - tensorboard==2.21.0
      - pandas==2.3.3
      - lpips==0.1.4
      - zstandard==0.25.0
      - kornia==0.8.2
      - timm==1.0.30
      - safetensors==0.8.0
      - py-spy
      - git+https://github.com/EasternJournalist/utils3d.git@9a4eb15e4021b67b12c460c7057d642626897ec8
